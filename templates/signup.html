{% extends "base.html" %}

{% block title %}Sign Up | Spartan Marketplace{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Create a seller account</h1>
  <p>Use your SJSU email address to register.</p>

  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">SJSU email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{ email }}"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      minlength="8"
      autocomplete="new-password"
      required
    >

    <label for="confirm_password">Confirm password</label>
    <input
      id="confirm_password"
      name="confirm_password"
      type="password"
      minlength="8"
      autocomplete="new-password"
      required
    >

    <button type="submit" class="btn btn-blue">Create account</button>
  </form>

  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
