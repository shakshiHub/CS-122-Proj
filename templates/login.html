{% extends "base.html" %}

{% block title %}Log In | Spartan Marketplace{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Log in</h1>

  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{ email }}"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button type="submit" class="btn btn-blue">Log in</button>
  </form>

  <p>Need an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</section>
{% endblock %}
